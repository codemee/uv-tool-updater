[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "uv-tool-updater"
version = "0.1.8"
description = "Lifecycle-safe updates for Python applications installed with uv tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "uv-tool-updater contributors" }]
dependencies = ["packaging>=24"]
keywords = ["uv", "updater", "cli", "desktop", "packaging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
show-version = "uv_tool_updater.cli:main"

[project.urls]
Homepage = "https://github.com/codemee/uv-tool-updater"
Repository = "https://github.com/codemee/uv-tool-updater"
Issues = "https://github.com/codemee/uv-tool-updater/issues"
Changelog = "https://github.com/codemee/uv-tool-updater/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/uv_tool_updater"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
